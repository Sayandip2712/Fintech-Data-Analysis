[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-customer-analytics"
version = "1.1.0"
description = "Revenue-First Fintech Analytics, RFM Segmentation & Explainable Churn Prediction Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Syandip"}
]
keywords = [
    "fintech",
    "churn-prediction",
    "rfm-segmentation",
    "shap-explainability",
    "machine-learning",
    "streamlit",
    "pandera"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
    "streamlit>=1.28.0",
    "duckdb>=0.9.0",
    "pandera>=0.18.0",
    "faker>=19.0.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
