name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  # Allows you to trigger the workflow manually from the Actions tab to test it
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Visit Streamlit App
        env:
          APP_URL: "https://fintech-data-analysis.streamlit.app/"
        run: |
          python -c "
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ['APP_URL']
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until='networkidle', timeout=60000)
              
              # If the app is currently asleep, click the wake-up button
              wake_button = page.locator('button:has-text(\"Yes, get this app back up!\")')
              if wake_button.is_visible(timeout=5000):
                  wake_button.click()
                  page.wait_for_timeout(30000)
              else:
                  # Wait 10 seconds to ensure the WebSocket connection initializes
                  page.wait_for_timeout(10000)
                  
              browser.close()
          "

